services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: papermate
      POSTGRES_USER: papermate
      POSTGRES_PASSWORD: papermate
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U papermate -d papermate"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://papermate:papermate@postgres:5432/papermate
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: change-this-to-a-long-random-secret-in-production
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8080"

volumes:
  postgres_data:
  redis_data:
